[project]
name = "loading"
version = "0.1.0"
description = "Matrix data analysis with pip and Poetry"
authors = [{name = "Enes İlhan", email = "enilhan@student.42istanbul.com.tr"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "matplotlib>=3.11.2",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
